name: Commit Diff Comment

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  comment-diff:
    permissions: write-all
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build diff summary
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          AFTER="${{ github.event.after }}"
          BEFORE="${{ github.event.before }}"
          ZERO="0000000000000000000000000000000000000000"

          # New branch (no previous commit) or a before-commit we no longer
          # have (e.g. after a force-push) both fall back to an empty tree,
          # so the diff becomes "everything in AFTER is new".
          if [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE="$(git hash-object -t tree /dev/null)"
          fi

          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"

          # --no-renames keeps the status letters simple: every changed path
          # is exactly one of Added / Removed / Modified.
          NAME_STATUS="$(git diff --no-renames --name-status "$BEFORE" "$AFTER")"

          if [ -z "$NAME_STATUS" ]; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_diff=true" >> "$GITHUB_OUTPUT"

          : > added.txt
          : > removed.txt
          : > modified.txt

          while IFS=$'\t' read -r status path; do
            case "$status" in
              A) echo "$path" >> added.txt ;;
              D) echo "$path" >> removed.txt ;;
              *) echo "$path" >> modified.txt ;;
            esac
          done <<< "$NAME_STATUS"

      - name: Post commit comments
        if: steps.diff.outputs.has_diff == 'true'
        uses: actions/github-script@v7
        env:
          DIFF_BEFORE: ${{ steps.diff.outputs.before }}
          DIFF_AFTER: ${{ steps.diff.outputs.after }}
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');

            const MAX_BYTES = 60000; // commit comments cap out at 65536 chars
            const MAX_FILE_COMMENTS = 25; // keep a big Roblox update from spamming hundreds of comments

            const readLines = (file) =>
              fs.existsSync(file)
                ? fs.readFileSync(file, 'utf8').split('\n').map((s) => s.trim()).filter(Boolean)
                : [];

            const truncate = (text) => {
              const buf = Buffer.from(text, 'utf8');
              if (buf.length <= MAX_BYTES) return text;
              return buf.subarray(0, MAX_BYTES).toString('utf8') + '\n\n... (truncated)';
            };

            const postComment = (body) =>
              github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: truncate(body),
              });

            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            const added = readLines('added.txt');
            const removed = readLines('removed.txt');
            const modified = readLines('modified.txt');

            const before = process.env.DIFF_BEFORE;
            const after = process.env.DIFF_AFTER;

            const section = (title, files) =>
              files.length ? `## ${title}\n` + files.map((f) => `- \`${f}\``).join('\n') + '\n\n' : '';

            // Locale CSVs are "Key,Value" rows, so a line-based diff is noisy.
            // Instead, read each side's key/value map and report which keys
            // were added, removed, or changed.
            const readAtRef = (ref, file) => {
              try {
                return execFileSync('git', ['show', `${ref}:${file}`], {
                  maxBuffer: 1024 * 1024 * 50,
                }).toString('utf8');
              } catch {
                return null; // file doesn't exist at this ref
              }
            };

            const parseCsv = (text) => {
              const map = new Map();
              const lines = text.split(/\r?\n/).slice(1); // skip "Key,Value" header
              for (const line of lines) {
                if (!line.trim()) continue;
                const match = line.match(/^("(?:[^"]|"")*"|[^,]*),(.*)$/);
                if (!match) continue;
                const unquote = (s) =>
                  s.startsWith('"') && s.endsWith('"') ? s.slice(1, -1).replace(/""/g, '"') : s;
                map.set(unquote(match[1]), unquote(match[2]));
              }
              return map;
            };

            const diffCsv = (oldMap, newMap) => {
              const addedKeys = [];
              const removedKeys = [];
              const changedKeys = [];
              for (const [k, v] of newMap) {
                if (!oldMap.has(k)) addedKeys.push([k, v]);
                else if (oldMap.get(k) !== v) changedKeys.push([k, oldMap.get(k), v]);
              }
              for (const [k, v] of oldMap) {
                if (!newMap.has(k)) removedKeys.push([k, v]);
              }
              return { addedKeys, removedKeys, changedKeys };
            };

            const formatCsvDiff = ({ addedKeys, removedKeys, changedKeys }) => {
              const lines = [];
              if (addedKeys.length) {
                lines.push('# Added');
                for (const [k, v] of addedKeys) lines.push(`+ ${k} ${v}`);
              }
              if (removedKeys.length) {
                lines.push('# Removed');
                for (const [k, v] of removedKeys) lines.push(`- ${k} ${v}`);
              }
              if (changedKeys.length) {
                lines.push('# Changed');
                for (const [k, oldV, newV] of changedKeys) {
                  lines.push(`+ ${k} ${newV}`);
                  lines.push(`- ${k} ${oldV}`);
                }
              }
              return lines.join('\n');
            };

            const localeFiles = [...added, ...removed, ...modified]
              .filter((f) => f.startsWith('Locales/'))
              .sort();

            let localesSection = '';
            for (const file of localeFiles) {
              const oldText = readAtRef(before, file);
              const newText = readAtRef(after, file);
              const csvDiff = diffCsv(
                oldText ? parseCsv(oldText) : new Map(),
                newText ? parseCsv(newText) : new Map(),
              );
              const body = formatCsvDiff(csvDiff);
              if (!body) continue;
              localesSection += `\n**\`${file}\`**\n\`\`\`diff\n${body}\n\`\`\`\n`;
            }

            const summary =
              section('Added files', added) +
              section('Removed files', removed) +
              section('Modified files', modified) +
              (localesSection ? `## Locales Diffs\n${localesSection}` : '');

            await postComment(summary.trim());

            // Locale files already got a key-level diff above, so skip them here.
            const nonLocaleModified = modified.filter((f) => !f.startsWith('Locales/'));
            const filesToDiff = nonLocaleModified.slice(0, MAX_FILE_COMMENTS);
            const skipped = nonLocaleModified.slice(MAX_FILE_COMMENTS);

            for (const file of filesToDiff) {
              let diff;
              try {
                diff = execFileSync('git', ['diff', '--no-renames', before, after, '--', file], {
                  maxBuffer: 1024 * 1024 * 20,
                }).toString('utf8');
              } catch (e) {
                diff = `Error computing diff for this file: ${e.message}`;
              }

              if (!diff.trim()) continue;

              await postComment(`### Diff: \`${file}\`\n\n\`\`\`diff\n${diff}\n\`\`\``);
              await sleep(500); // stay well under the commit-comments secondary rate limit
            }

            if (skipped.length) {
              await postComment(
                `${skipped.length} more modified file(s) were skipped to avoid flooding this commit with comments:\n\n` +
                  skipped.map((f) => `- \`${f}\``).join('\n'),
              );
            }
